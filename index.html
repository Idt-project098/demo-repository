<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#234b3a"><title>CampusSubmit — Campus, organised</title><style>
:root{--bg:#f6f3ea;--green:#234b3a;--deep:#18382d;--gold:#b69a5b;--ink:#26332d;--muted:#78837b;--line:#e8e5dc;--white:#fff;--soft:#edf1e9;--red:#a44c3e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:245px 1fr}.side{background:var(--green);color:#fff;padding:25px 17px;display:flex;flex-direction:column;gap:22px}.brand{font-size:21px;font-weight:800;letter-spacing:-.6px}.brand small{display:block;color:#c8d6ca;font-size:11px;font-weight:500;letter-spacing:1.4px;text-transform:uppercase;margin-top:3px}.rolebox{background:#183c2d;padding:4px;border-radius:12px;display:grid;grid-template-columns:1fr 1fr}.rolebox button{border:0;background:transparent;color:#d5e0d7;padding:10px 5px;border-radius:9px;font-weight:650}.rolebox button.active{background:#fff;color:var(--green)}.nav{display:grid;gap:5px}.nav button{border:0;text-align:left;background:transparent;color:#dce6de;padding:12px;border-radius:10px}.nav button.active,.nav button:hover{background:#ffffff1c;color:#fff}.sidefoot{margin-top:auto;color:#c8d6ca;font-size:12px}.main{min-width:0}.top{height:70px;background:#faf8f2;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px}.top small{color:var(--muted)}.userpill{border:1px solid var(--line);border-radius:30px;padding:7px 12px;background:#fff;font-weight:700;font-size:13px}.content{max-width:1180px;margin:auto;padding:30px}.eyebrow{font-size:11px;letter-spacing:1.6px;font-weight:800;color:var(--gold)}.head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin:5px 0 22px}.head h1{font-size:30px;line-height:1.2;margin:0;letter-spacing:-.7px}.sub{color:var(--muted);margin:7px 0 0}.btn{border:0;background:var(--green);color:white;padding:10px 15px;border-radius:9px;font-weight:750}.btn:hover{background:var(--deep)}.btn.secondary{background:#fff;color:var(--green);border:1px solid var(--line)}.btn.gold{background:#efe7d4;color:#70582b}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin:20px 0}.stat,.panel,.item,.subject{background:#fff;border:1px solid var(--line);border-radius:14px;padding:17px}.stat label{font-size:12px;color:var(--muted)}.stat strong{display:block;font-size:29px;margin-top:3px}.grid{display:grid;grid-template-columns:1.15fr 1fr;gap:15px}.panel h3{margin:0 0 12px}.lineitem{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}.lineitem:first-of-type{border-top:0}.pill{display:inline-block;background:var(--soft);color:var(--green);font-size:11px;font-weight:800;padding:5px 10px;border-radius:30px;white-space:nowrap}.pill.pending{background:#f4efdf;color:#80642d}.pill.sent{background:#f8e9e5;color:#a44c3e}.items{display:grid;gap:13px}.item h3{font-size:16px;margin:0}.item p{color:var(--muted);font-size:13px}.itemtop,.itemfoot{display:flex;justify-content:space-between;align-items:center;gap:12px}.itemfoot{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}.muted{color:var(--muted)}.notice{background:#f4efdf;color:#70582b;padding:12px 14px;border-radius:10px;margin-bottom:15px;font-size:13px}.subjectgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.subject b{display:block;margin:10px 0 4px}.subject p{font-size:13px;color:var(--muted)}.field{display:grid;gap:6px;margin:13px 0}.field label{font-size:12px;font-weight:750}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;background:white;color:var(--ink)}.field textarea{min-height:85px;resize:vertical}.password-wrap{display:flex;align-items:center;position:relative}.password-wrap input{padding-right:48px}.password-toggle{position:absolute;right:7px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--muted);padding:7px;border-radius:7px;display:flex;align-items:center;justify-content:center}.password-toggle:hover{background:var(--soft);color:var(--green)}.password-toggle svg{width:19px;height:19px;display:block}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{text-align:left;padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}.table th{font-size:10px;letter-spacing:1px;color:var(--muted)}.teacherbanner{background:#e9eee7;color:var(--green);padding:10px 13px;border-radius:10px;font-size:12px;font-weight:800;margin-bottom:16px}.modalback{position:fixed;inset:0;background:#10251dcc;display:none;align-items:center;justify-content:center;padding:16px;z-index:10}.modal{background:var(--bg);width:min(520px,100%);padding:22px;border-radius:16px;max-height:92vh;overflow:auto;box-shadow:0 20px 70px #0003}.modalhead{display:flex;align-items:center;justify-content:space-between;gap:12px}.modalhead h2{margin:0;font-size:21px}.close{border:0;border-radius:50%;width:34px;height:34px;font-size:20px;background:#fff}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--deep);color:white;padding:11px 16px;border-radius:10px;display:none;z-index:20;box-shadow:0 6px 25px #0002}.link{color:var(--green);font-weight:750;font-size:12px}.empty{padding:25px;text-align:center;color:var(--muted)}@media(max-width:800px){.app{grid-template-columns:1fr}.side{padding:14px;gap:11px}.brand{font-size:19px}.brand small{display:inline;margin-left:8px}.nav{display:flex;overflow-x:auto}.nav button{white-space:nowrap;padding:9px 11px}.sidefoot{display:none}.top{height:58px;padding:0 15px}.content{padding:22px 14px}.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.head{align-items:flex-start;flex-direction:column}.subjectgrid{grid-template-columns:1fr}}@media(max-width:420px){.itemtop,.itemfoot{align-items:flex-start;flex-direction:column}.top small{font-size:10px}}

.btn.small{padding:7px 11px;font-size:12px}
.btn.danger{background:#fff;color:var(--red);border:1px solid #ecd3cd}
.row-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.checklist{display:grid;gap:6px;max-height:190px;overflow:auto;border:1px solid var(--line);border-radius:9px;padding:10px;background:#fff}
.checklist label{display:flex;gap:8px;align-items:center;font-size:14px;font-weight:500;cursor:pointer;margin:0}
.checklist input[type=checkbox]{width:auto;padding:0;margin:0;border:0}
.doubt{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:13px}
.reply{background:#f7f5ee;border-left:3px solid var(--gold);padding:9px 11px;border-radius:8px;margin-top:8px;font-size:13px}
.tiny{font-size:12px}
.itemfoot{flex-wrap:wrap}
.lineitem{flex-wrap:wrap}
</style></head><body>
<div class="app">
  <aside class="side">
    <div class="brand">CampusSubmit<small>YOUR CAMPUS, ORGANISED</small></div>
    <div class="rolebox">
      <button id="studentTab" class="active" data-act="showStudentLogin">Student</button>
      <button id="teacherTab" data-act="showTeacherLogin">Teacher</button>
    </div>
    <nav class="nav" id="nav"></nav>
    <div id="logoutWrap"></div>
    <div class="sidefoot">PROJECT DEMO · RBU<br>Semester 1 · 2026–30</div>
  </aside>
  <main class="main">
    <header class="top"><small>Electronics &amp; Computer Science · Semester 1</small><span class="userpill" id="userLabel">Not signed in</span></header>
    <section class="content" id="view"></section>
  </main>
</div>
<div class="modalback" id="modalBack"><div class="modal">
  <div class="modalhead"><h2 id="modalTitle"></h2><button class="close" data-act="closeModal" aria-label="Close">×</button></div>
  <div id="modalBody"></div>
</div></div>
<div class="toast" id="toast"></div>
<script>

'use strict';
const SUBJECTS=['Fundamentals of Programming','Basic Electronics','Innovation and Design Thinking','Probability and Statistics','Digital Logic Design'];
const MAX_FILE_BYTES=10*1024*1024;
const TEACHER_PASSWORD='teacher@098';
const STORE_KEY='csDemoV4';
const SEED_STUDENTS=['Aryan Sonare','Krutika Selokar','Anmol Handa','Fazil Zama Qureshi','Zahid Khan','Anuj Dhadwe','Apurva Nandane'];
const SEED_TASKS=[
 {id:1,title:'C Programming — Loops & Patterns',subject:0,due:'2026-11-08',description:'Solve the loop-based pattern problems and submit your answers.',createdBy:'Faculty',attachment:null,assignedTo:'all',submissions:{}},
 {id:2,title:'Diode Characteristics',subject:1,due:'2026-11-10',description:'Draw forward and reverse bias characteristics with observations.',createdBy:'Faculty',attachment:null,assignedTo:'all',submissions:{}},
 {id:3,title:'Design Thinking Worksheet',subject:2,due:'2026-11-12',description:'Complete the problem statement and ideation worksheet.',createdBy:'Faculty',attachment:null,assignedTo:'all',submissions:{}}
];
const EYE='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>';

function freshState(){return{students:SEED_STUDENTS.map(name=>({name})),tasks:JSON.parse(JSON.stringify(SEED_TASKS)),doubts:[]}}
function loadState(){try{const s=JSON.parse(localStorage.getItem(STORE_KEY));if(s&&Array.isArray(s.students)&&Array.isArray(s.tasks)&&Array.isArray(s.doubts))return s}catch(e){}return freshState()}
let state=loadState();
let session={role:'guest',student:''};
let page='dashboard';

/* ---------- helpers ---------- */
const $=id=>document.getElementById(id);
function persist(){try{localStorage.setItem(STORE_KEY,JSON.stringify(state));return true}catch(e){toast('Storage is full. Use files under 1 MB.');return false}}
function toast(msg){const el=$('toast');el.textContent=msg;el.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>el.style.display='none',2600)}
function openModal(title,html){$('modalTitle').textContent=title;$('modalBody').innerHTML=html;$('modalBack').style.display='flex'}
function closeModal(){$('modalBack').style.display='none'}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function firstName(n){return String(n).trim().split(/\s+/)[0]}
function passFor(n){return firstName(n)+'@123'}
function me(){return session.student}
function fmtDate(d){if(!d)return 'Not set';const x=new Date(d+'T00:00:00');return isNaN(x)?d:x.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})}
function fmtTime(iso){const x=new Date(iso);return isNaN(x)?'':x.toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}
function pillClass(status){return (!status||status==='Pending')?'pending':status==='Submitted'?'sent':''}
function pwField(id,label,placeholder){return `<div class="field"><label>${label}</label><div class="password-wrap"><input id="${id}" type="password" placeholder="${esc(placeholder)}" autocomplete="current-password"><button class="password-toggle" type="button" data-act="togglePw" data-target="${id}" aria-label="Show password" title="Show password">${EYE}</button></div></div>`}

function studentNames(){return state.students.map(s=>s.name)}
function findTask(id){return state.tasks.find(t=>t.id===id)}
function assignedNames(t){const all=studentNames();return t.assignedTo==='all'?all:(Array.isArray(t.assignedTo)?t.assignedTo.filter(n=>all.includes(n)):[])}
function isAssigned(t,name){return assignedNames(t).includes(name)}
function assignedCount(t){return assignedNames(t).length}
function assignedLabel(t){return t.assignedTo==='all'?'all students':`${assignedCount(t)} student(s)`}
function submittedCount(t){return assignedNames(t).filter(n=>t.submissions?.[n]&&t.submissions[n].status!=='Pending').length}
function visibleTasks(){if(session.role==='teacher')return state.tasks;if(session.role==='student')return state.tasks.filter(t=>isAssigned(t,me()));return []}
function openDoubtCount(){return state.doubts.filter(d=>d.status!=='Resolved').length}

let dbPromise=null;
function fileDB(){if(!dbPromise)dbPromise=new Promise((res,rej)=>{const r=indexedDB.open('campussubmit-files',1);r.onupgradeneeded=()=>r.result.createObjectStore('files');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});return dbPromise}
async function putBlob(key,blob){const db=await fileDB();return new Promise((res,rej)=>{const tx=db.transaction('files','readwrite');tx.objectStore('files').put(blob,key);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
async function getBlob(key){const db=await fileDB();return new Promise((res,rej)=>{const r=db.transaction('files').objectStore('files').get(key);r.onsuccess=()=>res(r.result||null);r.onerror=()=>rej(r.error)})}
async function saveFile(file){const key=Date.now()+'-'+Math.random().toString(36).slice(2,8);await putBlob(key,file);return{name:file.name,type:file.type,size:file.size,key}}
function pickFile(input){const f=input?.files?.[0];if(!f)return null;if(f.size>MAX_FILE_BYTES){toast('This file is larger than 10 MB. Please choose a smaller file.');return false}return f}
async function openFile(key,name){
  try{const blob=await getBlob(key);if(!blob)return toast('File not found on this device');
    const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name||'file';document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),60000);
  }catch(e){toast('Could not open file: '+(e?.message||e))}
}
/* ---------- login ---------- */
function setTabs(mode){$('studentTab').classList.toggle('active',mode==='student');$('teacherTab').classList.toggle('active',mode==='teacher')}
function showStudentLogin(){
  session={role:'guest',student:''};page='dashboard';render();setTabs('student');
  openModal('Student login',`<p class="muted">Choose your name and enter your demo password.</p>
  <div class="field"><label>Student name</label><select id="loginName">${state.students.map(s=>`<option>${esc(s.name)}</option>`).join('')}</select></div>
  ${pwField('loginPass','Password','FirstName@123')}
  <button class="btn" data-act="studentLogin">Login as student</button>
  <p class="muted" style="font-size:12px">Demo password format: first name + @123 (example: Aryan@123).</p>`);
}
function studentLogin(){
  const name=$('loginName').value,pass=$('loginPass').value;
  if(pass!==passFor(name)){toast('Incorrect student password');return}
  session={role:'student',student:name};page='dashboard';closeModal();render();toast('Welcome, '+firstName(name));
}
function showTeacherLogin(){
  session={role:'guest',student:''};page='dashboard';render();setTabs('teacher');
  openModal('Teacher login',`<p class="muted">Faculty workspace is password protected.</p>
  ${pwField('teacherPass','Teacher password','Enter teacher password')}
  <button class="btn" data-act="teacherLogin">Login as teacher</button>`);
}
function teacherLogin(){
  if($('teacherPass').value!==TEACHER_PASSWORD){toast('Incorrect teacher password');return}
  session={role:'teacher',student:''};page='dashboard';closeModal();render();toast('Teacher mode unlocked');
}
function logout(){session={role:'guest',student:''};page='dashboard';setTabs('none');render();toast('Logged out')}

/* ---------- navigation ---------- */
function openDoubtsBadge(){const n=openDoubtCount();return n?` (${n})`:''}
function navItems(){
  if(session.role==='student')return[['dashboard','Overview'],['assignments','Assignments'],['materials','Study material'],['evaluation','My evaluation'],['doubts','Doubt corner']];
  if(session.role==='teacher')return[['dashboard','Faculty overview'],['assignments','Assignments'],['submissions','Review submissions'],['doubts','Doubt corner'+openDoubtsBadge()],['materials','Study material'],['students','Students']];
  return[];
}
function go(p){closeModal();page=p;render();window.scrollTo(0,0)}
function render(){
  state=loadState();
  const items=navItems();
  if(!items.some(([p])=>p===page))page='dashboard';
  $('nav').innerHTML=items.map(([p,n])=>`<button class="${page===p?'active':''}" data-act="go" data-page="${p}">${n}</button>`).join('');
  $('logoutWrap').innerHTML=session.role==='guest'?'':'<button class="btn secondary" style="width:100%;margin-bottom:12px" data-act="logout">Log out</button>';
  $('userLabel').textContent=session.role==='student'?me():session.role==='teacher'?'Faculty · Teacher mode':'Not signed in';
  const views={dashboard,assignments:assignmentsPage,submissions:submissionsPage,doubts:doubtsPage,materials:materialsPage,evaluation:evaluationPage,students:studentsPage};
  $('view').innerHTML=session.role==='guest'?welcome():views[page]();
}
function heading(k,t,s,button=''){return `<div class="eyebrow">${k}</div><div class="head"><div><h1>${t}</h1><p class="sub">${s}</p></div>${button}</div>`}
function welcome(){return `<div class="eyebrow">CAMPUS WORKSPACE</div><div class="head"><div><h1>Welcome to CampusSubmit</h1><p class="sub">A simple place to share assignments, study resources and feedback.</p></div></div><div class="panel"><h3>Choose your workspace</h3><p class="muted">Use the Student or Teacher button in the left panel to sign in.</p><button class="btn" data-act="showStudentLogin">Student login</button> <button class="btn secondary" data-act="showTeacherLogin">Teacher login</button></div>`}

/* ---------- dashboard ---------- */
function dashboard(){
  const T=session.role==='teacher';const tasks=visibleTasks();let stats;
  if(!T){
    const mine=tasks.map(t=>t.submissions?.[me()]).filter(Boolean);
    const done=mine.filter(s=>s.status!=='Pending').length;
    stats=[['Assigned',tasks.length],['Submitted',done],['Evaluated',mine.filter(s=>s.status==='Evaluated').length],['Pending',tasks.length-done]];
  }else{
    const subs=state.tasks.flatMap(t=>Object.values(t.submissions||{}));
    stats=[['Assignments',state.tasks.length],['Submissions',subs.length],['To review',subs.filter(s=>s.status==='Submitted').length],['Open doubts',openDoubtCount()]];
  }
  const recent=tasks.slice(0,4).map(t=>{
    const st=t.submissions?.[me()]?.status||'Pending';
    return `<div class="lineitem"><span>${esc(t.title)}</span><div class="row-actions">${T?'':`<span class="pill ${pillClass(st)}">${st}</span>`}<button class="btn secondary small" data-act="viewTask" data-id="${t.id}">Open</button></div></div>`;
  }).join('')||'<p class="muted">No assignments yet.</p>';
  const subjects=SUBJECTS.map(s=>`<div class="lineitem"><span>${esc(s)}</span><span class="muted">SEM 1</span></div>`).join('');
  return heading(T?'FACULTY WORKSPACE':'STUDENT SPACE',T?'Faculty overview':`Welcome back, ${esc(firstName(me()))} 👋`,'A quick overview of your classroom activity.')
    +(T?'<div class="teacherbanner">TEACHER MODE · Create assignments, review student files, answer doubts and manage students.</div>':'')
    +`<div class="stats">${stats.map(x=>`<div class="stat"><label>${x[0]}</label><strong>${x[1]}</strong></div>`).join('')}</div>`
    +`<div class="grid"><div class="panel"><h3>Recent assignments</h3>${recent}</div><div class="panel"><h3>My subjects</h3>${subjects}</div></div>`;
}

/* ---------- assignments ---------- */
function assignmentsPage(){
  const T=session.role==='teacher';
  const btn=T?'<button class="btn" data-act="createTask">＋ Create assignment</button>':'';
  const tasks=visibleTasks();
  const cards=tasks.length?tasks.map(t=>T?teacherCard(t):studentCard(t)).join(''):'<div class="panel empty">No assignments yet.</div>';
  return heading('CLASSROOM WORK','Assignments',T?'Create tasks, assign them to students and track submissions.':'Open an assignment, read the instructions and upload your completed file.',btn)
    +`<div class="notice">${T?'Teacher view: assign work to all or selected students, then review each submission.':'Your uploaded files and status are saved in this browser for the demo.'}</div><div class="items">${cards}</div>`;
}
function taskCard(t,pill,foot,action){
  return `<article class="item"><div class="itemtop"><div><h3>${esc(t.title)}</h3><span class="muted">${SUBJECTS[t.subject]} · Due ${fmtDate(t.due)}</span></div>${pill}</div><p>${esc(t.description)}</p>${t.attachment?`<a class="link" href="#" data-act="openFile" data-key="${esc(t.attachment.key)}" data-name="${esc(t.attachment.name)}">↓ Assignment file: ${esc(t.attachment.name)}</a>`:''}<div class="itemfoot">${foot}<div class="row-actions">${action}</div></div></article>`;
}
function studentCard(t){
  const sub=t.submissions?.[me()]||{};const st=sub.status||'Pending';
  const foot=`<span class="muted">${sub.status==='Evaluated'?'Marks: '+sub.marks+'/10':sub.file?'Uploaded: '+esc(sub.file.name):'Not submitted yet'}</span>`;
  const action=st==='Evaluated'
    ?`<button class="btn secondary" data-act="viewTask" data-id="${t.id}">View feedback</button>`
    :`<button class="btn" data-act="uploadWork" data-id="${t.id}">${sub.file?'Replace submitted file':'Upload completed work'}</button>`;
  return taskCard(t,`<span class="pill ${pillClass(st)}">${st}</span>`,foot,action);
}
function teacherCard(t){
  return taskCard(t,'',`<span class="muted">Assigned to ${assignedLabel(t)} · Submitted ${submittedCount(t)}/${assignedCount(t)}</span>`,
    `<button class="btn secondary" data-act="viewTask" data-id="${t.id}">View</button><button class="btn" data-act="go" data-page="submissions">Review submissions</button>`);
}

function createTask(){
  openModal('Create assignment',`
  <div class="field"><label>Assignment title</label><input id="taskTitle" maxlength="100" placeholder="e.g. Logic gates worksheet"></div>
  <div class="field"><label>Subject</label><select id="taskSubject">${SUBJECTS.map((s,i)=>`<option value="${i}">${esc(s)}</option>`).join('')}</select></div>
  <div class="field"><label>Due date</label><input id="taskDue" type="date"></div>
  <div class="field"><label>Instructions</label><textarea id="taskDesc" maxlength="1000" placeholder="Explain what students must do"></textarea></div>
  <div class="field"><label>Assign to</label>
    <div class="checklist">${studentNames().map(n=>`<label><input type="checkbox" class="assignCb" value="${esc(n)}" checked> ${esc(n)}</label>`).join('')||'<span class="muted">Add students first.</span>'}</div>
    <div class="row-actions" style="margin-top:6px"><button class="btn secondary small" data-act="assignAll" data-on="1">Select all</button><button class="btn secondary small" data-act="assignAll" data-on="0">Clear</button></div>
  </div>
  <div class="field"><label>Attach assignment file (optional, max 10 MB)</label><input id="taskFile" type="file" accept=".pdf,.doc,.docx,.ppt,.pptx,.jpg,.jpeg,.png"></div>
  <button class="btn" data-act="publishTask">Publish assignment</button>`);
}
async function publishTask(){
  const title=$('taskTitle').value.trim();
  if(!title)return toast('Enter an assignment title');
  const subject=+$('taskSubject').value,due=$('taskDue').value,description=$('taskDesc').value.trim()||'Complete the assigned task.';
  const boxes=[...document.querySelectorAll('.assignCb')];
  const chosen=boxes.filter(b=>b.checked).map(b=>b.value);
  if(!chosen.length)return toast('Assign it to at least one student');
  const assignedTo=chosen.length===boxes.length?'all':chosen;
  const f=pickFile($('taskFile'));if(f===false)return;
  try{
    const attachment=f?await saveFile(f):null;
    state.tasks.unshift({id:Date.now(),title,subject,due,description,createdBy:'Faculty',attachment,assignedTo,submissions:{}});
    if(!persist())return;
    closeModal();render();toast('Assignment published');
  }catch(e){toast('Could not save file: '+(e?.message||e))}
}
function taskDetail(t){
  let body=`<p class="muted">${SUBJECTS[t.subject]} · Due ${fmtDate(t.due)}</p><p>${esc(t.description)}</p>`;
  if(t.attachment)body+=`<p><a class="link" href="#" data-act="openFile" data-key="${esc(t.attachment.key)}" data-name="${esc(t.attachment.name)}">↓ Download assignment file: ${esc(t.attachment.name)}</a></p>`;
  if(session.role==='student'){
    const sub=t.submissions?.[me()];
    body+=`<p><span class="pill ${pillClass(sub?.status)}">${sub?.status||'Pending'}</span></p>`;
    body+=sub?.status==='Evaluated'
      ?`<h2 style="color:var(--green)">${sub.marks}/10</h2><p>${esc(sub.feedback||'No written feedback was added.')}</p>`
      :`<button class="btn" data-act="uploadWork" data-id="${t.id}">${sub?'Replace submitted file':'Upload completed work'}</button>`;
  }else{
    body+=`<p class="muted">Assigned to ${assignedLabel(t)} · Submitted ${submittedCount(t)}/${assignedCount(t)}</p>
    <div class="row-actions"><button class="btn" data-act="go" data-page="submissions">Review submissions</button><button class="btn secondary" data-act="deleteTask" data-id="${t.id}">Delete assignment</button></div>`;
  }
  return body;
}
function viewTask(id){
  const t=findTask(id);if(!t)return toast('Assignment not found');
  if(session.role==='student'&&!isAssigned(t,me()))return toast('This assignment is not assigned to you');
  openModal(t.title,taskDetail(t));
}
function uploadWork(id){
  const t=findTask(id);if(!t)return toast('Assignment not found');
  if(session.role!=='student'||!isAssigned(t,me()))return toast('This assignment is not assigned to you');
  if(t.submissions?.[me()]?.status==='Evaluated')return toast('This work has already been evaluated');
  openModal('Submit your assignment',`<p class="muted">Select your completed work. Accepted: PDF, Word, PowerPoint or image. Maximum 10 MB.</p>
  <div class="field"><label>Choose completed file</label><input id="workFile" type="file" accept=".pdf,.doc,.docx,.ppt,.pptx,.jpg,.jpeg,.png"></div>
  <button class="btn" data-act="submitWork" data-id="${id}">Submit assignment</button>`);
}
async function submitWork(id){
  const t=findTask(id);if(!t)return toast('Assignment not found');
  if(!isAssigned(t,me()))return toast('This assignment is not assigned to you');
  if(t.submissions?.[me()]?.status==='Evaluated')return toast('This work has already been evaluated');
  const f=pickFile($('workFile'));
  if(f===null)return toast('Choose a file first');
  if(f===false)return;
  try{
    const file=await saveFile(f);
    t.submissions=t.submissions||{};
    t.submissions[me()]={status:'Submitted',file,submittedAt:new Date().toISOString(),marks:null,feedback:''};
    if(!persist())return;
    closeModal();render();toast('Assignment submitted successfully');
  }catch(e){toast('Could not save file: '+(e?.message||e))}
}
function deleteTask(id){
  const t=findTask(id);if(!t)return;
  if(!confirm(`Delete "${t.title}"? All submissions for it will be lost.`))return;
  state.tasks=state.tasks.filter(x=>x.id!==id);persist();closeModal();render();toast('Assignment deleted');
}

/* ---------- teacher: review ---------- */
function submissionsPage(){
  const rows=[];
  state.tasks.forEach(t=>assignedNames(t).forEach(name=>rows.push({t,name,s:t.submissions?.[name]})));
  const order={Submitted:0,Evaluated:1};
  rows.sort((a,b)=>(order[a.s?.status]??2)-(order[b.s?.status]??2));
  const body=rows.length?rows.map(({t,name,s})=>`<tr><td>${esc(name)}</td><td>${esc(t.title)}</td>
    <td>${s?.file?`<a class="link" href="#" data-act="openFile" data-key="${esc(s.file.key)}" data-name="${esc(s.file.name)}">${esc(s.file.name)}</a>`:'—'}</td>
    <td><span class="pill ${pillClass(s?.status)}">${s?.status||'Pending'}</span></td>
    <td>${s?.marks==null?'—':s.marks+'/10'}</td>
    <td>${s?.file?`<button class="btn small" data-act="reviewStudent" data-id="${t.id}" data-name="${esc(name)}">Review</button>`:''}</td></tr>`).join('')
    :'<tr><td colspan="6" class="empty">No assignments yet.</td></tr>';
  return heading('FACULTY REVIEW','Review submissions','Every assigned student appears here. Open a submitted file to review it and publish marks.')
    +`<div class="panel tablewrap"><table class="table"><thead><tr><th>Student</th><th>Assignment</th><th>File</th><th>Status</th><th>Marks</th><th>Action</th></tr></thead><tbody>${body}</tbody></table></div>`;
}
function reviewStudent(id,name){
  const t=findTask(id),s=t?.submissions?.[name];
  if(!s)return toast('Submission not found');
  openModal('Review student submission',`<p><b>${esc(name)}</b><br><span class="muted">${esc(t.title)}</span></p>
  <p>${s.file?`<a class="link" href="#" data-act="openFile" data-key="${esc(s.file.key)}" data-name="${esc(s.file.name)}">↓ Open / download ${esc(s.file.name)}</a>`:'No uploaded file'}</p>
  <div class="field"><label>Marks out of 10</label><input id="reviewMarks" type="number" min="0" max="10" step="0.5" value="${s.marks??''}" placeholder="e.g. 8"></div>
  <div class="field"><label>Teacher feedback</label><textarea id="reviewFeedback" maxlength="1000" placeholder="Write feedback">${esc(s.feedback||'')}</textarea></div>
  <button class="btn" data-act="saveReview" data-id="${id}" data-name="${esc(name)}">Save review & publish marks</button>`);
}
function saveReview(id,name){
  const raw=$('reviewMarks').value,marks=Number(raw),feedback=$('reviewFeedback').value.trim();
  if(raw===''||!Number.isFinite(marks)||marks<0||marks>10)return toast('Enter marks from 0 to 10');
  const t=findTask(id);if(!t?.submissions?.[name])return toast('Submission not found');
  Object.assign(t.submissions[name],{status:'Evaluated',marks,feedback,reviewedAt:new Date().toISOString()});
  if(!persist())return;
  closeModal();render();toast('Marks and feedback published');
}

/* ---------- evaluation / materials ---------- */
function evaluationPage(){
  const rows=visibleTasks().map(t=>({t,s:t.submissions?.[me()]}));
  const body=rows.length?rows.map(({t,s})=>`<tr><td>${esc(t.title)}</td><td><span class="pill ${pillClass(s?.status)}">${s?.status||'Pending'}</span></td><td>${s?.marks==null?'—':s.marks+'/10'}</td><td>${esc(s?.status==='Evaluated'?(s.feedback||'No written feedback'):'Awaiting review')}</td></tr>`).join('')
    :'<tr><td colspan="4" class="empty">No assignments yet.</td></tr>';
  return heading('STUDENT PROGRESS','My evaluation','Check marks and feedback published by your teacher.')
    +`<div class="panel tablewrap"><table class="table"><thead><tr><th>Assignment</th><th>Status</th><th>Marks</th><th>Feedback</th></tr></thead><tbody>${body}</tbody></table></div>`;
}
function materialsPage(){
  const desc=['C basics, loops and functions.','Diodes, biasing and rectifiers.','Empathy, problem definition and ideation.','Random variables and probability distributions.','Number systems and Boolean algebra.'];
  return heading('LEARNING LIBRARY','Study material','Browse starter notes for your semester subjects.')
    +'<div class="subjectgrid">'+SUBJECTS.map((s,i)=>`<article class="subject"><span class="pill">SUBJECT 0${i+1}</span><b>${esc(s)}</b><p>${desc[i]}</p><button class="btn secondary" data-act="openNotes" data-i="${i}">Open notes</button></article>`).join('')+'</div>';
}
function openNotes(i){
  const notes=['C is a general-purpose programming language. A loop repeats a set of statements. Common loops are for, while and do-while.','A PN junction diode conducts mainly in forward bias. In reverse bias, only a small leakage current flows.','Design thinking commonly includes empathise, define, ideate, prototype and test.','For a Poisson random variable, P(X=x)=e⁻λ λˣ/x!, where λ is the average rate.','Logic gates perform Boolean operations. AND outputs 1 when all inputs are 1; OR outputs 1 when at least one input is 1.'];
  openModal(SUBJECTS[i],`<p>${notes[i]}</p><p class="muted">Sample learning note for this demonstration.</p>`);
}

/* ---------- teacher: students ---------- */
function studentsPage(){
  const list=state.students.length
    ?state.students.map((s,i)=>`<div class="lineitem"><div><b>${esc(s.name)}</b><br><span class="muted tiny">Login password: ${esc(passFor(s.name))}</span></div><div class="row-actions"><span class="muted">#${i+1}</span><button class="btn secondary small" data-act="removeStudent" data-name="${esc(s.name)}">Remove</button></div></div>`).join('')
    :'<div class="empty">No students yet. Add the first student.</div>';
  return heading('CLASS ROSTER','Students',`${state.students.length} student(s) in this class. New students can log in straight away.`,'<button class="btn" data-act="addStudent">＋ Add student</button>')
    +`<div class="panel">${list}</div>`;
}
function addStudent(){
  openModal('Add student',`<p class="muted">The student logs in with their first name + @123 as the password, and is added to all "all students" assignments.</p>
  <div class="field"><label>Full name</label><input id="newStudent" maxlength="60" placeholder="e.g. Riya Patil"></div>
  <button class="btn" data-act="saveStudent">Add student</button>`);
}
function saveStudent(){
  const name=$('newStudent').value.trim().replace(/\s+/g,' ');
  if(name.length<2)return toast('Enter the student name');
  if(state.students.some(s=>s.name.toLowerCase()===name.toLowerCase()))return toast('This student already exists');
  state.students.push({name});
  if(!persist())return;
  closeModal();render();toast(`Added ${name}. Password: ${passFor(name)}`);
}
function removeStudent(name){
  if(!confirm(`Remove ${name}? Their submitted work stays in the records, but they can no longer log in.`))return;
  state.students=state.students.filter(s=>s.name!==name);
  state.tasks.forEach(t=>{if(Array.isArray(t.assignedTo))t.assignedTo=t.assignedTo.filter(n=>n!==name)});
  persist();render();toast(`${name} removed`);
}

/* ---------- doubts (shared by students and teacher) ---------- */
function subjectLabel(i){return (i>=0&&SUBJECTS[i])?SUBJECTS[i]:'General'}
function doubtsPage(){
  const T=session.role==='teacher';
  const form=T?'':`<div class="panel" style="margin-bottom:15px"><h3>Ask a doubt</h3>
    <p class="muted tiny" style="margin:0 0 10px">Your teacher sees every doubt posted here and replies in this section.</p>
    <div class="field"><label>Subject (optional)</label><select id="doubtSubject"><option value="-1">General</option>${SUBJECTS.map((s,i)=>`<option value="${i}">${esc(s)}</option>`).join('')}</select></div>
    <div class="field"><label>Your question</label><textarea id="doubtText" maxlength="1000" placeholder="Describe your doubt clearly"></textarea></div>
    <button class="btn" data-act="postDoubt">Post question</button></div>`;
  const list=state.doubts.length?state.doubts.map(d=>`<div class="doubt">
      <div class="itemtop"><div><b>${esc(d.by)}${!T&&d.by===me()?' (you)':''}</b><br><span class="muted tiny">${esc(subjectLabel(d.subject))} · ${fmtTime(d.createdAt)}</span></div>
      <span class="pill ${d.status==='Open'?'pending':d.status==='Answered'?'sent':''}">${d.status}</span></div>
      <p>${esc(d.text)}</p>
      ${d.replies.map(r=>`<div class="reply"><b>${esc(r.by)}</b> · <span class="muted tiny">${fmtTime(r.at)}</span><br>${esc(r.text)}</div>`).join('')}
      ${T?`<div class="field" style="margin:10px 0 8px"><textarea id="reply-${d.id}" maxlength="1000" placeholder="Write a reply to ${esc(d.by)}"></textarea></div>
      <div class="row-actions"><button class="btn small" data-act="replyDoubt" data-id="${d.id}">Send reply</button>${d.status!=='Resolved'?`<button class="btn secondary small" data-act="resolveDoubt" data-id="${d.id}">Mark resolved</button>`:''}</div>`:''}
    </div>`).join(''):'<div class="panel empty">No doubts posted yet.</div>';
  return heading(T?'TEACHER INBOX':'CLASS DISCUSSION','Doubt corner',T?`${openDoubtCount()} doubt(s) waiting for a reply.`:'Ask a question and get answers from your teacher.')+form+list;
}
function postDoubt(){
  const text=$('doubtText').value.trim();
  if(!text)return toast('Write your question first');
  state.doubts.unshift({id:Date.now(),text,by:me(),subject:+$('doubtSubject').value,createdAt:new Date().toISOString(),status:'Open',replies:[]});
  if(!persist())return;
  render();toast('Question posted. Your teacher will see it here.');
}
function replyDoubt(id){
  const txt=$('reply-'+id).value.trim();
  if(!txt)return toast('Write a reply first');
  const d=state.doubts.find(x=>x.id===id);if(!d)return toast('Doubt not found');
  d.replies.push({by:'Teacher',text:txt,at:new Date().toISOString()});
  d.status='Answered';
  if(!persist())return;
  render();toast('Reply sent');
}
function resolveDoubt(id){
  const d=state.doubts.find(x=>x.id===id);if(!d)return;
  d.status='Resolved';persist();render();toast('Marked as resolved');
}

/* ---------- events ---------- */
const ACTIONS={
  togglePw(el){const input=$(el.dataset.target);if(!input)return;const show=input.type==='password';input.type=show?'text':'password';const label=show?'Hide password':'Show password';el.setAttribute('aria-label',label);el.title=label},
  go(el){go(el.dataset.page)},
  showStudentLogin(){showStudentLogin()},
  showTeacherLogin(){showTeacherLogin()},
  studentLogin(){studentLogin()},
  teacherLogin(){teacherLogin()},
  logout(){logout()},
  closeModal(){closeModal()},
  createTask(){createTask()},
  assignAll(el){document.querySelectorAll('.assignCb').forEach(b=>{b.checked=el.dataset.on==='1'})},
  publishTask(){publishTask()},
  viewTask(el){viewTask(Number(el.dataset.id))},
  uploadWork(el){uploadWork(Number(el.dataset.id))},
  submitWork(el){submitWork(Number(el.dataset.id))},
  deleteTask(el){deleteTask(Number(el.dataset.id))},
  reviewStudent(el){reviewStudent(Number(el.dataset.id),el.dataset.name)},
  saveReview(el){saveReview(Number(el.dataset.id),el.dataset.name)},
  openNotes(el){openNotes(Number(el.dataset.i))},
  openFile(el){openFile(el.dataset.key,el.dataset.name)},
  addStudent(){addStudent()},
  saveStudent(){saveStudent()},
  removeStudent(el){removeStudent(el.dataset.name)},
  postDoubt(){postDoubt()},
  replyDoubt(el){replyDoubt(Number(el.dataset.id))},
  resolveDoubt(el){resolveDoubt(Number(el.dataset.id))}
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const fn=ACTIONS[el.dataset.act];if(fn){e.preventDefault();state=loadState();fn(el)}
});
// Keep open pages in sync when the saved data changes (another tab, or the teacher's replies).
window.addEventListener('storage',e=>{if(e.key!==STORE_KEY)return;const typing=['TEXTAREA','INPUT','SELECT'].includes(document.activeElement?.tagName);if(typing||$('modalBack').style.display==='flex'){state=loadState();return}render()});
$('modalBack').addEventListener('click',e=>{if(e.target.id==='modalBack')closeModal()});
render();


</script></body></html>
